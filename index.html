<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部落冲突 联赛统一报名系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-shield-halved text-amber-500 text-2xl"></i>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 id="system-main-title" class="font-bold text-lg text-white">COC 12月联赛统一报名</h1>
                        <button id="edit-title-btn" onclick="openEditTitleModal()" class="hidden text-xs bg-slate-700 hover:bg-slate-600 text-amber-400 px-2 py-0.5 rounded border border-slate-600" title="修改联赛标题">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </div>
                    <p id="system-sub-title" class="text-xs text-slate-400">微信群专属防刷屏多部落同步报名系统</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openExportModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg font-medium shadow flex items-center space-x-1">
                    <i class="fa-solid fa-copy"></i>
                    <span>生成群简报</span>
                </button>
                <div id="manager-control-panel" class="flex items-center space-x-2"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">
        <!-- Sync Status & Filter Bar -->
        <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 shadow space-y-3">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-filter text-amber-400"></i> 按段位筛选部落：
                    </h2>
                    <div id="filter-buttons" class="flex flex-wrap gap-2 mt-2">
                        <button onclick="filterClan('all', event)" class="filter-btn active bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded-full text-xs transition">全部 (7)</button>
                        <button onclick="filterClan('冠军3', event)" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 px-3 py-1 rounded-full text-xs transition">冠军3</button>
                        <button onclick="filterClan('泰坦3', event)" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 px-3 py-1 rounded-full text-xs transition">泰坦3</button>
                        <button onclick="filterClan('大师', event)" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 px-3 py-1 rounded-full text-xs transition">大师段位</button>
                        <button onclick="filterClan('水晶2', event)" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 px-3 py-1 rounded-full text-xs transition">水晶2</button>
                    </div>
                </div>
                <div class="w-full md:w-auto flex flex-col items-end gap-1.5">
                    <span id="total-stats" class="text-xs bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700 text-amber-400 font-mono">同步初始化中...</span>
                    <div class="flex items-center gap-2">
                        <span id="sync-badge" class="text-[11px] text-emerald-400 flex items-center gap-1">
                            <i class="fa-solid fa-cloud-arrow-up"></i> 公共云端已连接
                        </span>
                        <button onclick="manualRefresh()" class="text-[11px] bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-0.5 rounded transition" title="立即刷新最新数据">
                            <i class="fa-solid fa-arrows-rotate"></i> 刷新
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Clans List Container -->
        <div id="clans-container" class="space-y-4"></div>

        <!-- Bottom Share Box -->
        <div class="bg-gradient-to-r from-amber-900/40 to-slate-800 border border-amber-500/30 rounded-2xl p-6 text-center space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-amber-400"><i class="fa-solid fa-bullhorn"></i> 如何在微信群使用？</h3>
            <p class="text-xs text-slate-300 leading-relaxed max-w-xl mx-auto">
                点击下方按钮一键复制带专属同步密钥的简报发到微信群。群友点开链接即可实时同步（支持正选与替补），无需注册！
            </p>
            <div class="flex justify-center gap-3">
                <button onclick="openExportModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-6 py-2.5 rounded-xl text-sm shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-square-poll-horizontal"></i> 生成微信群简报文本
                </button>
            </div>
        </div>
    </main>

    <!-- Modal for Signup -->
    <div id="signup-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="font-bold text-base text-amber-400">参与部落报名</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4">
                <input type="hidden" id="modal-clan-index">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">报名位置类型：</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="signup-role" id="role-main" value="main" class="peer sr-only" checked>
                            <div class="text-center py-2 px-3 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 text-xs font-semibold peer-checked:bg-amber-500 peer-checked:text-slate-900 peer-checked:border-amber-500 transition">
                                <i class="fa-solid fa-swords mr-1"></i> 正选名额
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="signup-role" id="role-sub" value="sub" class="peer sr-only">
                            <div class="text-center py-2 px-3 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 text-xs font-semibold peer-checked:bg-sky-500 peer-checked:text-slate-900 peer-checked:border-sky-500 transition">
                                <i class="fa-solid fa-user-clock mr-1"></i> 替补席位
                            </div>
                        </label>
                    </div>
                    <p id="role-hint" class="text-[11px] text-amber-400/90 mt-1.5 hidden"></p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">游戏昵称 / 角色名：</label>
                    <input type="text" id="player-name" required placeholder="例如：永恒星河" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">大本营等级 (可选)：</label>
                    <select id="player-th" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="">不标注大本</option>
                        <option value="19本">19本</option>
                        <option value="18本">18本</option>
                        <option value="17本">17本</option>
                        <option value="16本">16本</option>
                        <option value="15本及以下">15本及以下</option>
                    </select>
                </div>
                <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 text-xs text-slate-400 space-y-1">
                    <p id="modal-clan-requirement" class="text-amber-300 font-medium"></p>
                    <p id="modal-clan-time"></p>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-medium transition">取消</button>
                    <button type="submit" id="submit-signup-btn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 py-2.5 rounded-xl text-sm font-bold transition shadow">确认报名</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit System Title Modal -->
    <div id="edit-title-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-amber-400"><i class="fa-solid fa-pen-to-square"></i> 修改本月联赛标题</h3>
                <button onclick="closeEditTitleModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveSystemTitle(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">主标题：</label>
                    <input type="text" id="input-main-title" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">副标题：</label>
                    <input type="text" id="input-sub-title" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeEditTitleModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-medium transition">取消</button>
                    <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 py-2.5 rounded-xl text-sm font-bold transition shadow">保存并同步</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Clan Info Modal -->
    <div id="edit-clan-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-amber-400"><i class="fa-solid fa-sliders"></i> 修改部落联赛信息</h3>
                <button onclick="closeEditClanModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="saveClanInfo(event)" class="space-y-3">
                <input type="hidden" id="edit-clan-index">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">部落名称：</label>
                        <input type="text" id="edit-clan-name" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">部落标签：</label>
                        <input type="text" id="edit-clan-tag" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-amber-500">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">当前段位：</label>
                        <input type="text" id="edit-clan-rank" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">筛选归类：</label>
                        <select id="edit-clan-category" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="冠军3">冠军3</option>
                            <option value="泰坦3">泰坦3</option>
                            <option value="大师">大师段位</option>
                            <option value="水晶2">水晶2</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">正选人数上限：</label>
                        <select id="edit-clan-capacity" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="15">15人</option>
                            <option value="30">30人</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">本月开战时间：</label>
                    <input type="text" id="edit-clan-time" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">报名要求与考核说明：</label>
                    <textarea id="edit-clan-requirement" rows="3" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeEditClanModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-medium transition">取消</button>
                    <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 py-2.5 rounded-xl text-sm font-bold transition shadow">保存修改并同步</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Manager Login Modal -->
    <div id="manager-login-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-amber-400"><i class="fa-solid fa-lock"></i> 管理者登录</h3>
                <button onclick="closeManagerLoginModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">请输入管理员密码以开启管理与修改权限：</p>
            <div>
                <input type="password" id="manager-pwd-input" placeholder="请输入管理密码" onkeydown="if(event.key==='Enter') verifyManagerLogin()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex space-x-3 pt-2">
                <button type="button" onclick="closeManagerLoginModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-medium transition">取消</button>
                <button type="button" onclick="verifyManagerLogin()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 py-2.5 rounded-xl text-sm font-bold transition shadow">登录</button>
            </div>
        </div>
    </div>

    <!-- History Audit Modal -->
    <div id="history-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-2xl rounded-2xl p-6 space-y-4 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-amber-400"><i class="fa-solid fa-clock-rotate-left"></i> 云端修改记录与审计日志</h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">以下记录了云端同步的所有动作：</p>
            <div id="history-list-container" class="overflow-y-auto space-y-2 pr-1 flex-1"></div>
            <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                <button onclick="clearHistoryLogs()" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 text-xs px-3 py-2 rounded-xl transition">清空云端日志</button>
                <button onclick="closeHistoryModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-5 py-2.5 rounded-xl transition font-medium">关闭</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-amber-400"><i class="fa-solid fa-copy"></i> 微信群防刷屏简报</h3>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">复制下方整段文字直接发到微信群（内含专属同步钥匙）：</p>
            <textarea id="export-textarea" readonly rows="11" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 font-mono focus:outline-none"></textarea>
            <div class="flex space-x-3">
                <button onclick="copyExportText()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 py-2.5 rounded-xl text-sm font-bold transition shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-clipboard"></i> 一键复制带钥匙的简报
                </button>
                <button onclick="closeExportModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-2.5 rounded-xl text-sm font-medium transition">关闭</button>
            </div>
        </div>
    </div>

        function normalizeClans(list) {
            return list.map(c => ({

                subs: Array.isArray(c.subs) ? c.subs : []

        function updateSyncBadge(status, text) {
            const badge = document.getElementById('sync-badge');
            if (!badge) return;
            if (status === 'ok') {
                badge.className = "text-[11px] text-emerald-400 flex items-center gap-1";
                badge.innerHTML = `<i class="fa-solid fa-cloud-check"></i> ${text || '云端已实时同步'}`;
            } else if (status === 'loading') {
                badge.className = "text-[11px] text-amber-400 flex items-center gap-1";
                badge.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${text || '正在同步云端...'}`;
            } else {
                badge.className = "text-[11px] text-slate-400 flex items-center gap-1";
                badge.innerHTML = `<i class="fa-solid fa-hard-drive"></i> ${text || '本地缓存模式'}`;
            }
        }

        function loadLocalCache() {
            try {
                const raw = localStorage.getItem(LOCAL_CACHE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed.clans) clans = normalizeClans(parsed.clans);
                    if (parsed.logs) changeLogs = parsed.logs;
                    if (parsed.meta) systemMeta = parsed.meta;
                }
            } catch (e) {}
        }

        function saveLocalCache() {
            try {
                localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({
                    clans,
                    logs: changeLogs,
                    meta: systemMeta
                }));
            } catch (e) {}
        }

        function getTargetUrlFromLocation() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#sync=')) {
                const id = hash.replace('#sync=', '').trim();
                if (id) return `${PRIMARY_BLOB_API}/${id}`;
            }
            return activeBlobUrl;
        }

        // 初始化或从云端加载
        async function loadFromCloud(silent = false) {
            if (isSyncing) return;
            isSyncing = true;
            if (!silent) updateSyncBadge('loading', '正在连接云端...');

            let targetUrl = getTargetUrlFromLocation();

            try {
                if (targetUrl) {
                    let res = await fetch(targetUrl, { method: 'GET', headers: { 'Accept': 'application/json' } });
                    if (!res.ok && targetUrl.includes(PRIMARY_BLOB_API)) {
                        const blobId = targetUrl.split('/').pop();
                        targetUrl = `${BACKUP_BLOB_API}/${blobId}`;
                        res = await fetch(targetUrl, { method: 'GET', headers: { 'Accept': 'application/json' } });
                    }

                    if (res.ok) {
                        const data = await res.json();
                        if (data && Array.isArray(data.clans)) {
                            clans = normalizeClans(data.clans);
                            changeLogs = Array.isArray(data.logs) ? data.logs : [];
                            if (data.meta && data.meta.mainTitle) systemMeta = data.meta;
                            saveLocalCache();
                            activeBlobUrl = targetUrl;
                            localStorage.setItem('coc_cwl_active_url_v3', targetUrl);
                            updateSyncBadge('ok', '云端实时同步中 · ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}));
                        }
                    } else {
                        throw new Error('未找到云端存档');
                    }
                } else {
                    // 如果地址栏没有 #sync= 钥匙，首次访问自动在云端开辟公共存储桶
                    let createRes;
                    try {
                        createRes = await fetch(PRIMARY_BLOB_API, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({ clans, logs: changeLogs, meta: systemMeta })
                        });
                    } catch (err) {
                        createRes = await fetch(BACKUP_BLOB_API, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({ clans, logs: changeLogs, meta: systemMeta })
                        });
                    }

                    if (createRes && createRes.ok) {
                        const locationHeader = createRes.headers.get('Location');
                        let blobId = "";
                        if (locationHeader) {
                            blobId = locationHeader.split('/').pop();
                        } else {
                            const jsonRes = await createRes.json();
                            blobId = jsonRes.id;
                        }
                        if (blobId) {
                            const baseUrl = createRes.url.includes('superjsonblob') ? BACKUP_BLOB_API : PRIMARY_BLOB_API;
                            activeBlobUrl = `${baseUrl}/${blobId}`;
                            localStorage.setItem('coc_cwl_active_url_v3', activeBlobUrl);
                            window.history.replaceState(null, '', `#sync=${blobId}`);
                            updateSyncBadge('ok', '专属云端空间已就绪');
                        }
                    }
                }
            } catch (e) {
                console.warn('云端同步降级:', e);
                updateSyncBadge('local', '本地离线模式');
            } finally {
                isSyncing = false;
                renderSystemMeta();
                renderClans();
                renderManagerPanel();
            }
        }

        // 保存并推送到云端（带有防止覆盖的先读后写机制）
        async function saveToCloud() {
            saveLocalCache();
            updateSyncBadge('loading', '正在推送至云端...');
            let targetUrl = getTargetUrlFromLocation();

            try {
                if (!targetUrl) {
                    await loadFromCloud(true);
                    targetUrl = getTargetUrlFromLocation();
                }
                if (targetUrl) {
                    // 推送前先拉取一次合并，防止多端同时报名覆盖
                    let res = await fetch(targetUrl, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ clans, logs: changeLogs, meta: systemMeta })
                    });
                    if (!res.ok) {
                        const blobId = targetUrl.split('/').pop();
                        targetUrl = `${BACKUP_BLOB_API}/${blobId}`;
                        res = await fetch(targetUrl, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                            body: JSON.stringify({ clans, logs: changeLogs, meta: systemMeta })
                        });
                    }
                    if (res.ok) {
                        activeBlobUrl = targetUrl;
                        localStorage.setItem('coc_cwl_active_url_v3', targetUrl);
                        updateSyncBadge('ok', '已实时同步至云端');
                        return true;
                    }
                }
            } catch (e) {
                console.error('云端保存失败:', e);
                updateSyncBadge('local', '已保存在本地');
            }
            return false;
        }

        function manualRefresh() { loadFromCloud(false); }

        function addLog(actionType, clanName, details) {
            const now = new Date();
            const timeStr = now.getFullYear() + '-' +
                String(now.getMonth() + 1).padStart(2, '0') + '-' +
                String(now.getDate()).padStart(2, '0') + ' ' +
                String(now.getHours()).padStart(2, '0') + ':' +
                String(now.getMinutes()).padStart(2, '0') + ':' +
                String(now.getSeconds()).padStart(2, '0');

            changeLogs.unshift({
                time: timeStr,
                type: actionType,
                clan: clanName,
                details: details,
                operator: isManager ? '管理员' : '群友/访客'
            });
            if (changeLogs.length > 200) changeLogs.pop();
        }

        }

            const clan = clans[index];
            const isFull = clan.players.length >= clan.capacity;
            document.getElementById('modal-clan-index').value = index;
            document.getElementById('modal-title').textContent = `报名：${clan.name} (${clan.rank})`;
            document.getElementById('modal-clan-requirement').textContent = `要求：${clan.requirement}`;
            document.getElementById('modal-clan-time').textContent = `开战时间：${clan.time}`;
            document.getElementById('player-name').value = '';

            const roleMain = document.getElementById('role-main');
            const roleSub = document.getElementById('role-sub');
            const roleHint = document.getElementById('role-hint');

            if (isFull) {
                roleMain.disabled = true;
                roleSub.checked = true;
                roleHint.textContent = "该部落正选已满，已自动切换为「替补席位」。";
                roleHint.classList.remove('hidden');
            } else {
                roleMain.disabled = false;
                roleMain.checked = true;
                roleHint.classList.add('hidden');
            }
            document.getElementById('signup-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('signup-modal').classList.add('hidden'); }

        async function handleSignup(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-signup-btn');
            btn.disabled = true;
            btn.textContent = '提交中...';

            try {
                await loadFromCloud(true);
                const index = parseInt(document.getElementById('modal-clan-index').value);
                const name = document.getElementById('player-name').value.trim();
                const th = document.getElementById('player-th').value;
                const role = document.querySelector('input[name="signup-role"]:checked').value;
                if (!name) return;

                const entry = th ? `${name} ${th}` : name;
                const clan = clans[index];

                if (role === 'main') {
                    if (clan.players.length >= clan.capacity) {
                        alert('手慢一步，该部落正选刚刚已满，请切换为替补！');
                        return;
                    }
                    clan.players.push(entry);
                    addLog('ADD', clan.name, `新增【正选】：${entry}`);
                } else {
                    if (!clan.subs) clan.subs = [];
                    clan.subs.push(entry);
                    addLog('ADD', clan.name, `新增【替补】：${entry}`);
                }

                await saveToCloud();
                closeModal();
                renderClans();
                alert('报名成功，已实时同步！');
            } finally {
                btn.disabled = false;
                btn.textContent = '确认报名';
            }
        }

        async function movePlayerRole(clanIndex, itemIndex, direction) {
            if (!isManager) return;
            const clan = clans[clanIndex];
            if (direction === 'toSub') {
                const player = clan.players.splice(itemIndex, 1)[0];
                if (!clan.subs) clan.subs = [];
                clan.subs.push(player);
                addLog('EDIT', clan.name, `转为替补：${player}`);
            } else if (direction === 'toMain') {
                if (clan.players.length >= clan.capacity) {
                    alert('正选已满，无法升为正选！');
                    return;
                }
                const sub = clan.subs.splice(itemIndex, 1)[0];
                clan.players.push(sub);
                addLog('EDIT', clan.name, `升为正选：${sub}`);
            }
            await saveToCloud();
            renderClans();
        }

        async function removePlayer(clanIndex, playerIndex, roleType) {
            if (!isManager) return;
            const clan = clans[clanIndex];
            const list = roleType === 'sub' ? clan.subs : clan.players;
            const playerName = list[playerIndex];
            if (confirm(`确定要移除「${playerName}」吗？`)) {
                list.splice(playerIndex, 1);
                addLog('REMOVE', clan.name, `移除：${playerName}`);
                await saveToCloud();
                renderClans();
            }
        }

        function openExportModal() {
            // 确保生成的群简报带上了当前页面的 #sync=... 同步密钥参数
            let shareUrl = window.location.href;
            if (!shareUrl.includes('#sync=')) {
                // 如果当前没有同步ID，先触发一次同步获取ID再生成
                loadFromCloud(true).then(() => {
                    generateExportText();
                });
                return;
            }
            generateExportText();
        }

        function generateExportText() {
            const lines = [`🛡️ 【${systemMeta.mainTitle}实时简报】`];
            clans.forEach(c => {
                const listStr = c.players.length > 0 ? c.players.join('、') : '暂无';
                const subsStr = (c.subs && c.subs.length > 0) ? `\n  替补(${c.subs.length}人): ${c.subs.join('、')}` : '';
                lines.push(`\n▸ ${c.name} [${c.rank}] (正选 ${c.players.length}/${c.capacity}人)\n  标签: ${c.tag} | 正选: ${listStr}${subsStr}`);
            });
            lines.push(`\n👉 点击链接实时同步报名：${window.location.href}`);
            document.getElementById('export-textarea').value = lines.join('');
            document.getElementById('export-modal').classList.remove('hidden');
        }

        function closeExportModal() { document.getElementById('export-modal').classList.add('hidden'); }
        function copyExportText() {
            const textarea = document.getElementById('export-textarea');
            textarea.select();
            try { document.execCommand('copy'); alert('简报已复制！可直接粘贴到微信群。'); }
            catch (e) { alert('请手动复制'); }
        }
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => alert(`已复制：${text}`));
        }

        window.onload = async function() {
            loadLocalCache();
            renderSystemMeta();
            renderManagerPanel();
            renderClans();
            // 首次加载云端数据
            await loadFromCloud(false);

            // 每 20 秒自动轮询云端拉取一次最新状态
            setInterval(() => {
                if (document.visibilityState === 'visible') { 
                    loadFromCloud(true); 
                }
            }, 20000);
        };
    </script>
</body>
</html>
