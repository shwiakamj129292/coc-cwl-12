<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部落冲突 12月联赛统一报名系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-shield-halved text-amber-500 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg text-white">COC 12月联赛统一报名</h1>
                    <p class="text-xs text-slate-400">微信群专属防刷屏多部落报名系统</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openExportModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-lg font-medium shadow flex items-center space-x-1">
                    <i class="fa-solid fa-copy"></i>
                    <span>生成群简报</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">
        <!-- Filter Bar -->
        <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 shadow">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-filter text-amber-400"></i> 按段位筛选部落：
                    </h2>
                    <div id="filter-buttons" class="flex flex-wrap gap-2 mt-2">
                        <button onclick="filterClan('all', event)" class="filter-btn active bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded-full text-xs transition">全部 (7)</button>
                        <button onclick="filterClan('冠军3', event)" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 px-3 py-1 rounded-full text-xs transition">冠军3</button>
                        <button onclick="filterClan('泰坦3', event)" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 px-3 py-1 rounded-full text-xs transition">泰坦3</button>
                        <button onclick="filterClan('大师', event)" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 px-3 py-1 rounded-full text-xs transition">大师段位</button>
                        <button onclick="filterClan('水晶2', event)" class="filter-btn bg-slate-700 text-slate-300 hover:bg-slate-600 px-3 py-1 rounded-full text-xs transition">水晶2</button>
                    </div>
                </div>
                <div class="w-full md:w-auto text-right">
                    <span id="total-stats" class="text-xs bg-slate-900/80 px-3 py-1.5 rounded-lg border border-slate-700 text-amber-400 font-mono">就绪</span>
                </div>
            </div>
        </div>

        <!-- Clans List Container -->
        <div id="clans-container" class="space-y-4">
            <!-- Rendered dynamically -->
        </div>

        <!-- Bottom Share Box -->
        <div class="bg-gradient-to-r from-amber-900/40 to-slate-800 border border-amber-500/30 rounded-2xl p-6 text-center space-y-4 shadow-xl">
            <h3 class="text-lg font-bold text-amber-400"><i class="fa-solid fa-bullhorn"></i> 如何在微信群使用？</h3>
            <p class="text-xs text-slate-300 leading-relaxed max-w-xl mx-auto">
                点击下方按钮一键复制精简防刷屏简报发到微信群。群友直接点开此网页链接即可随时随地自助报名和修改，彻底杜绝表格不支持、长接龙刷屏和漏掉名字的问题！
            </p>
            <div class="flex justify-center gap-3">
                <button onclick="openExportModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold px-6 py-2.5 rounded-xl text-sm shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-square-poll-horizontal"></i> 生成微信群简报文本
                </button>
            </div>
        </div>
    </main>

    <!-- Modal for Signup -->
    <div id="signup-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="font-bold text-base text-amber-400">参与部落报名</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="signup-form" onsubmit="handleSignup(event)" class="space-y-4">
                <input type="hidden" id="modal-clan-index">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">游戏昵称 / 角色名：</label>
                    <input type="text" id="player-name" required placeholder="例如：永恒星河" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">大本营等级 (可选)：</label>
                    <select id="player-th" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                        <option value="">不标注大本</option>
                        <option value="19本">19本</option>
                        <option value="18本">18本</option>
                        <option value="17本">17本</option>
                        <option value="16本">16本</option>
                        <option value="15本及以下">15本及以下</option>
                    </select>
                </div>
                <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 text-xs text-slate-400 space-y-1">
                    <p id="modal-clan-requirement" class="text-amber-300 font-medium"></p>
                    <p id="modal-clan-time"></p>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-medium transition">取消</button>
                    <button type="submit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 py-2.5 rounded-xl text-sm font-bold transition shadow">确认报名</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="export-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-amber-400"><i class="fa-solid fa-copy"></i> 微信群防刷屏简报</h3>
                <button onclick="closeExportModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">复制下方整段文字直接发到微信群，群友点开网页链接即可随时报名：</p>
            <textarea id="export-textarea" readonly rows="10" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 font-mono focus:outline-none"></textarea>
            <div class="flex space-x-3">
                <button onclick="copyExportText()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-900 py-2.5 rounded-xl text-sm font-bold transition shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-clipboard"></i> 一键复制简报
                </button>
                <button onclick="closeExportModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-2.5 rounded-xl text-sm font-medium transition">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const initialClans = [
            {
                id: "xiyang",
                name: "夕阳之秋 (晋级组)",
                tag: "#2PRCUGGJJ",
                rank: "泰坦3",
                category: "泰坦3",
                capacity: 15,
                time: "12月1号（下午4点）",
                requirement: "至少传奇2段位(至少一个号）；考核：传奇1模式 3进2（传奇1段位无需考核）",
                players: ["永恒星河✨洛", "神话再现✨洛", "黎明之夏✨洛", "春暖花开✨洛", "终为向日✨洛", "荧光之夜✨洛", "大千世界✨洛", "幽冥鬼域✨洛", "雨后春笋✨洛", "夜林之溪✨洛", "闪电龙骑士", "Allenyip"]
            },
            {
                id: "shikong",
                name: "时空之旅 (晋级组)",
                tag: "#2J002JY80",
                rank: "冠军3",
                category: "冠军3",
                capacity: 15,
                time: "12月1号（下午4点）",
                requirement: "至少传奇3段位（至少一个号）；考核：传奇3模式 4进3（传奇2及以上无需考核）",
                players: ["皇家禁卫军 18本", "皇家守护者 18本", "womeiyouwen 18本", "karina 18本", "karina 18本"]
            },
            {
                id: "piaoxue",
                name: "飘雪城",
                tag: "#2CRVVYQPJ",
                rank: "冠军3",
                category: "冠军3",
                capacity: 15,
                time: "12月1号（下午4点后）",
                requirement: "19本、18本（最多5个）有打19本3星实力；上次大师1/冠3/泰坦3有18星以上可直接报名，其他找梦幻巧克力审核",
                players: ["凛冬 19本", "林村 19本"]
            },
            {
                id: "xuejingling",
                name: "雪精灵",
                tag: "#2GPUCRVR2",
                rank: "大师2",
                category: "大师",
                capacity: 30,
                time: "12月1号（下午4点后）",
                requirement: "19本、18本、17本（最多5个）；7次次数必须用完，不可漏刀",
                players: []
            },
            {
                id: "huoyan",
                name: "火焰部落！",
                tag: "#Y8UR2GYP",
                rank: "大师3",
                category: "大师",
                capacity: 30,
                time: "12月1号（下午4点后）",
                requirement: "19本、18本、17本；7次次数必须用完，不可漏刀",
                players: []
            },
            {
                id: "siyue",
                name: "四月是你的谎言 (保级组)",
                tag: "#2JLLVYUVJ",
                rank: "水晶2",
                category: "水晶2",
                capacity: 30,
                time: "12月1号（下午4点）",
                requirement: "无大本营等级限制，积极进攻就行",
                players: []
            },
            {
                id: "bingjingling",
                name: "冰精灵",
                tag: "#2QJPQ88LJ",
                rank: "水晶2",
                category: "水晶2",
                capacity: 30,
                time: "12月1号（下午4点后）",
                requirement: "1到19本都可参加",
                players: ["皇家隐秘者 14本"]
            }
        ];

        let clans = initialClans;
        try {
            const saved = localStorage.getItem('coc_dec_cwl_clans_v3');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length === 7) {
                    clans = parsed;
                }
            }
        } catch (e) {
            console.error(e);
        }

        let currentFilter = 'all';

        function saveClans() {
            try {
                localStorage.setItem('coc_dec_cwl_clans_v3', JSON.stringify(clans));
            } catch (e) {
                console.error(e);
            }
        }

        function getRankBadgeStyle(rank) {
            if (rank.includes('冠军')) return 'bg-rose-500/20 text-rose-300 border-rose-500/40';
            if (rank.includes('泰坦')) return 'bg-purple-500/20 text-purple-300 border-purple-500/40';
            if (rank.includes('大师')) return 'bg-amber-500/20 text-amber-300 border-amber-500/40';
            return 'bg-sky-500/20 text-sky-300 border-sky-500/40';
        }

        function renderClans() {
            const container = document.getElementById('clans-container');
            if (!container) return;
            container.innerHTML = '';

            let totalSigned = 0;
            let totalCap = 0;

            clans.forEach((clan, index) => {
                totalSigned += clan.players.length;
                totalCap += clan.capacity;

                if (currentFilter !== 'all' && clan.category !== currentFilter) return;

                const isFull = clan.players.length >= clan.capacity;
                const progressPercent = Math.min(100, Math.round((clan.players.length / clan.capacity) * 100));

                const card = document.createElement('div');
                card.className = 'bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-lg space-y-4';

                const playersHtml = clan.players.length > 0
                    ? clan.players.map((p, pIdx) => `
                        <div class="flex items-center justify-between bg-slate-900/80 border border-slate-700/60 px-3 py-1.5 rounded-lg text-xs">
                            <span class="text-slate-200"><span class="text-amber-400 font-mono mr-1.5">${pIdx + 1}.</span>${escapeHtml(p)}</span>
                            <button onclick="removePlayer(${index}, ${pIdx})" title="取消报名" class="text-slate-500 hover:text-rose-400 transition ml-2 px-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `).join('')
                    : `<div class="col-span-full text-center py-4 text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-dashed border-slate-700/60">暂无人报名，点击右侧按钮抢占名额！</div>`;

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-700/70 pb-3">
                        <div class="space-y-1">
                            <div class="flex flex-wrap items-center gap-2">
                                <h3 class="font-bold text-base text-white">${escapeHtml(clan.name)}</h3>
                                <span class="text-xs px-2.5 py-0.5 rounded-full border font-semibold ${getRankBadgeStyle(clan.rank)}">${escapeHtml(clan.rank)}</span>
                                <span class="text-xs font-mono text-slate-400 bg-slate-900 px-2 py-0.5 rounded border border-slate-700 cursor-pointer hover:text-amber-400" onclick="copyText('${clan.tag}')" title="点击复制部落标签">${escapeHtml(clan.tag)} <i class="fa-regular fa-copy text-[10px]"></i></span>
                            </div>
                            <p class="text-xs text-slate-400"><i class="fa-regular fa-clock text-amber-400 mr-1"></i>开战时间：${escapeHtml(clan.time)}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <div class="text-xs font-mono font-bold ${isFull ? 'text-rose-400' : 'text-emerald-400'}">${clan.players.length} / ${clan.capacity} 人</div>
                                <div class="w-24 h-1.5 bg-slate-900 rounded-full overflow-hidden mt-1">
                                    <div class="h-full ${isFull ? 'bg-rose-500' : 'bg-amber-500'}" style="width: ${progressPercent}%"></div>
                                </div>
                            </div>
                            <button onclick="openSignupModal(${index})" ${isFull ? 'disabled' : ''} class="${isFull ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-400 text-slate-900 shadow'} font-bold text-xs px-4 py-2 rounded-xl transition whitespace-nowrap">
                                ${isFull ? '已满员' : '+ 我要报名'}
                            </button>
                        </div>
                    </div>
                    <div class="bg-slate-900/60 border border-slate-700/50 rounded-xl px-3.5 py-2.5 text-xs text-slate-300 leading-relaxed">
                        <span class="text-amber-400 font-semibold"><i class="fa-solid fa-circle-info mr-1"></i>报名要求：</span>${escapeHtml(clan.requirement)}
                    </div>
                    <div>
                        <div class="text-xs font-semibold text-slate-400 mb-2">已报名名单：</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                            ${playersHtml}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const statsEl = document.getElementById('total-stats');
            if (statsEl) statsEl.textContent = `总报名：${totalSigned} / ${totalCap} 人`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterClan(category, event) {
            currentFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-amber-500', 'text-slate-900', 'font-bold');
                btn.classList.add('bg-slate-700', 'text-slate-300');
            });
            if (event && event.currentTarget) {
                event.currentTarget.classList.remove('bg-slate-700', 'text-slate-300');
                event.currentTarget.classList.add('bg-amber-500', 'text-slate-900', 'font-bold');
            }
            renderClans();
        }

        function openSignupModal(index) {
            const clan = clans[index];
            document.getElementById('modal-clan-index').value = index;
            document.getElementById('modal-title').textContent = `报名：${clan.name} (${clan.rank})`;
            document.getElementById('modal-clan-requirement').textContent = `要求：${clan.requirement}`;
            document.getElementById('modal-clan-time').textContent = `开战时间：${clan.time}`;
            document.getElementById('player-name').value = '';
            document.getElementById('signup-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('signup-modal').classList.add('hidden');
        }

        function handleSignup(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('modal-clan-index').value);
            const name = document.getElementById('player-name').value.trim();
            const th = document.getElementById('player-th').value;
            if (!name) return;

            const entry = th ? `${name} ${th}` : name;
            clans[index].players.push(entry);
            saveClans();
            closeModal();
            renderClans();
        }

        function removePlayer(clanIndex, playerIndex) {
            const playerName = clans[clanIndex].players[playerIndex];
            if (confirm(`确定要移除「${playerName}」的报名记录吗？`)) {
                clans[clanIndex].players.splice(playerIndex, 1);
                saveClans();
                renderClans();
            }
        }

        function openExportModal() {
            const lines = ["🛡️ 【COC 12月联赛报名实时简报】"];
            clans.forEach(c => {
                const listStr = c.players.length > 0 ? c.players.join('、') : '暂无';
                lines.push(`\n▸ ${c.name} [${c.rank}] (${c.players.length}/${c.capacity}人)\n  标签: ${c.tag} | 名单: ${listStr}`);
            });
            lines.push(`\n👉 点击链接自助报名/修改：${window.location.href}`);
            document.getElementById('export-textarea').value = lines.join('\n');
            document.getElementById('export-modal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('expor
