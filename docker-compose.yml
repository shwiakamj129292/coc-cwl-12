services:
  coc-cwl:
    build: .
    image: coc-cwl:latest
    container_name: coc-cwl
    restart: unless-stopped
    ports:
      # 宿主机 8000 -> 容器 3000，可按需修改左侧端口
      - "8000:3000"
    environment:
      # 必须从 .env 或环境变量提供强密码；没有默认密码。
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD in .env}"
      PORT: "3000"
      DB_FILE: "/data/app.db"
    volumes:
      # 数据持久化：容器重建/升级不会丢失报名数据
      - coc-data:/data

volumes:
  coc-data:
